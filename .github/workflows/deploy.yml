name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optimize any new images
        run: |
          python fetch_images.py
          if [ -n "$(git status --porcelain source-images)" ] || [ ! -f assets/img/dims.json ]; then
            pip install -q pillow
            python optimize_images.py
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add source-images assets/img
            git commit -m "Optimize new images"
            git push
          fi
      - name: Build
        env:
          BASE: ""  # custom domain is live. For a github.io preview, set to /signalsinthenoisebook-site.
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
